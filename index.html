<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1d2233">
<title>Esi & Kwesi | A Letter For You</title>

<!-- Link preview: replace YOUR-DOMAIN and upload a 1200x630 preview.jpg -->
<meta property="og:type" content="website">
<meta property="og:title" content="Esi & Kwesi | A Letter For You">
<meta property="og:description" content="You are invited to the wedding of Esi and Kwesi. Thursday, 10 December 2026, Accra.">
<meta property="og:image" content="https://YOUR-DOMAIN/preview.jpg">
<meta property="og:url" content="https://YOUR-DOMAIN/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">

<style>
:root{--navy:#1d2233;--paper:#fbf4e4;--cream:#efe3cc;--ink:#262a45;--wine:#7d1f2b;--gold:#b08d57;--goldlt:#d9bf8c}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--navy);color:var(--cream);font-family:'Cormorant Garamond',serif;overflow-x:hidden}
button,input,select{font:inherit}
:focus-visible{outline:2px solid var(--goldlt);outline-offset:3px}

[hidden]{display:none!important}

/* wax seal, shared */
.wax{border-radius:50% 46% 52% 48%/48% 52% 46% 54%;color:#f3d3d6;display:grid;place-items:center;
  font-family:'Pinyon Script',cursive;
  background:radial-gradient(circle at 35% 30%,#b3414f,#7d1f2b 55%,#4f0f19);
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.12),inset 0 0 0 9px rgba(255,255,255,.05),0 4px 10px rgba(0,0,0,.45)}

/* ---------- STAGE ---------- */
.stage{position:relative;height:100svh;min-height:660px;overflow:hidden;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(ellipse at 50% 38%,#2e3450 0,#1d2233 55%,#12151f 100%)}
.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 4px)}
.kicker{position:absolute;top:9%;left:0;right:0;text-align:center;font:500 11px 'Montserrat',sans-serif;letter-spacing:5px;
  text-transform:uppercase;color:var(--goldlt);transition:opacity .6s}
.tapme{position:absolute;bottom:10%;left:0;right:0;text-align:center;font-style:italic;font-size:21px;color:var(--cream);
  animation:pulse 2s ease-in-out infinite;transition:opacity .6s}
@keyframes pulse{50%{opacity:.45}}
.opening .kicker,.opening .tapme{opacity:0}

.env{position:relative;width:min(88vw,400px);aspect-ratio:10/7;perspective:1000px;margin-top:6vh;
  transition:transform 1.1s ease-in,opacity 1.1s ease-in}
.back{position:absolute;inset:0;z-index:1;background:#d8c59c;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.peeklet{position:absolute;left:5%;right:5%;top:8%;height:86%;z-index:2;background:var(--paper);
  transition:transform .9s ease,opacity .5s}
.front{position:absolute;inset:0;z-index:3;background:linear-gradient(#ead9b8,#d9c59b);
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.addr{position:absolute;left:0;right:0;bottom:11%;z-index:4;text-align:center;font-family:'Pinyon Script',cursive;
  font-size:min(34px,9vw);color:var(--ink)}
.flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:4;transform-origin:top;
  background:linear-gradient(170deg,#f6ecd6 50%,#d9c8a2);clip-path:polygon(0 0,100% 0,50% 100%)}
.opening .flap{animation:flapOpen 1s ease-in-out .5s forwards}
@keyframes flapOpen{0%{transform:rotateX(0);z-index:4}49%{z-index:4}50%{z-index:1}100%{transform:rotateX(180deg);z-index:1}}

.seal{position:absolute;left:50%;top:58%;width:76px;height:76px;transform:translate(-50%,-50%);z-index:6;
  filter:drop-shadow(0 0 0 rgba(217,191,140,0));animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 12px rgba(217,191,140,.7))}}
.opening .seal{animation:none}
.half{position:absolute;inset:0;font-size:28px;transition:transform .7s ease,opacity .6s ease .45s}
.half.l{clip-path:polygon(0 0,54% 0,45% 38%,56% 62%,47% 100%,0 100%)}
.half.r{clip-path:polygon(54% 0,100% 0,100% 100%,47% 100%,56% 62%,45% 38%)}
.opening .half.l{transform:translate(-16px,12px) rotate(-16deg);opacity:0}
.opening .half.r{transform:translate(16px,14px) rotate(14deg);opacity:0}

.peek .peeklet{transform:translateY(-48%)}
.rise .peeklet{opacity:0}
.rise .env{transform:translateY(90vh) rotate(5deg);opacity:0}

/* ---------- THE LETTER ---------- */
.letter{position:absolute;left:50%;top:50%;width:min(88vw,440px);padding:38px 20px 30px;text-align:center;color:var(--ink);
  background:radial-gradient(ellipse at top,#fffaf0,var(--paper) 60%,#f1e5c9);box-shadow:0 30px 70px rgba(0,0,0,.55);
  transform:translate(-50%,-26%) scale(.5);opacity:0;pointer-events:none;
  transition:transform 1.2s cubic-bezier(.2,.7,.2,1),opacity .9s}
.letter::before{content:"";position:absolute;inset:9px;border:1px solid rgba(176,141,87,.55);pointer-events:none}
.rise .letter{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}

.line{display:table;margin:7px auto;white-space:nowrap;color:var(--ink);text-shadow:0 0 .6px rgba(38,42,69,.6);
  clip-path:inset(-14px 100% -14px -6px)}
.write .line{animation:ink var(--d,1s) linear var(--t,0s) forwards}
@keyframes ink{to{clip-path:inset(-14px -6px -14px -6px)}}
.stage.written .letter .line{clip-path:none;animation:none}
.line.s{font-family:'Pinyon Script',cursive;font-size:min(30px,8vw)}
.line.t{font-style:italic;font-size:min(24px,6.3vw)}
.line.n{font-family:'Pinyon Script',cursive;font-size:min(62px,16vw);color:var(--wine);margin:14px auto 12px;line-height:1.1}
.line.d{font-size:min(22px,5.8vw);font-weight:500}
.line.small{font-size:min(20px,5.4vw)}
.down{display:block;margin-top:8px;color:var(--wine);text-decoration:none;font-size:22px;opacity:0;transition:opacity 1s}
.stage.written .down{opacity:1;animation:pulse 2s ease-in-out infinite}

/* ---------- PAGE ---------- */
.sec{padding:80px 22px;text-align:center}
.sec.paper{background:var(--paper);color:var(--ink)}
.inner{max-width:560px;margin:auto}
.label{font:500 11px 'Montserrat',sans-serif;letter-spacing:4px;text-transform:uppercase;color:var(--goldlt);margin:0}
.paper .label{color:#7a5f35}
h2{font-family:'Pinyon Script',cursive;font-weight:400;font-size:clamp(46px,12vw,64px);line-height:1.1;margin:8px 0 0}
.lead{font-size:22px;font-style:italic;margin:12px 0 0}

.stamps{display:flex;justify-content:center;flex-wrap:wrap;gap:16px;margin:36px auto 0}
.stamp{min-width:78px;padding:18px 12px 12px;background:var(--paper);color:var(--ink);
  outline:5px dotted var(--navy);outline-offset:-3px}
.stamp strong{display:block;font-size:38px;font-weight:600;line-height:1}
.stamp span{font:500 11px 'Montserrat',sans-serif;letter-spacing:2px;text-transform:uppercase}

.rows{margin:28px auto 6px;text-align:center}
.row{padding:18px 0;border-bottom:1px solid rgba(176,141,87,.55)}
.row:first-child{border-top:1px solid rgba(176,141,87,.55)}
.row small{display:block;font:500 11px 'Montserrat',sans-serif;letter-spacing:3px;text-transform:uppercase;color:#7a5f35;margin-bottom:8px}
.row p{margin:0;font-size:26px;line-height:1.35}
.btn{display:inline-block;margin:18px 5px 0;padding:14px 22px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;
  font:600 11px 'Montserrat',sans-serif;letter-spacing:2px;text-transform:uppercase}

.reply{max-width:460px;margin:32px auto 0;padding:34px 26px;background:var(--paper);color:var(--ink);text-align:left;
  border:2px dashed var(--gold);outline:10px solid var(--paper);outline-offset:0}
label{display:block;font:500 11px 'Montserrat',sans-serif;letter-spacing:2px;text-transform:uppercase;color:#7a5f35;margin:20px 0 4px}
label:first-child{margin-top:0}
input,select{width:100%;padding:10px 2px;border:0;border-bottom:1px solid #8a7a5a;background:transparent;color:var(--ink);
  font-size:22px;border-radius:0}
select option{color:#222}
.reply button{width:100%;margin-top:28px;padding:16px;border:0;border-radius:999px;background:var(--wine);color:var(--cream);
  font:600 11px 'Montserrat',sans-serif;letter-spacing:3px;text-transform:uppercase;cursor:pointer}
.reply button:disabled{opacity:.6;cursor:wait}
#response{text-align:center;margin-top:16px;font-size:20px;font-style:italic;line-height:1.4}
#response.error{color:#9b2c2c}
.sealed{width:64px;height:64px;margin:14px auto 0;font-size:24px;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(2.4);opacity:0}}

footer{background:#12151f;text-align:center;padding:56px 20px 60px}
footer .wax{width:64px;height:64px;font-size:24px;margin:0 auto 14px}
footer h3{font-family:'Pinyon Script',cursive;font-weight:400;font-size:50px;color:var(--goldlt);margin:0}
footer p{margin:6px 0 0;font:500 11px 'Montserrat',sans-serif;letter-spacing:3px;text-transform:uppercase}

.reveal{opacity:0;transform:translateY(24px);transition:opacity 1s ease,transform 1s ease}
.reveal.visible{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<section class="stage" id="stage">
  <p class="kicker" id="kicker"></p>

  <div class="env">
    <div class="back"></div>
    <div class="peeklet"></div>
    <div class="front"></div>
    <p class="addr" id="addr"></p>
    <div class="flap"></div>
    <div class="seal" id="seal">
      <div class="half l wax"><span class="mono"></span></div>
      <div class="half r wax"><span class="mono"></span></div>
    </div>
  </div>

  <p class="tapme">Tap the seal</p>

  <div class="letter" id="letter">
    <p class="line s" id="l1"></p>
    <p class="line t">We are getting married</p>
    <p class="line t">and would love you there.</p>
    <p class="line n" data-np></p>
    <p class="line d" data-k="dateLabel"></p>
    <p class="line d" id="l6"></p>
    <p class="line d" data-k="place"></p>
    <p class="line t small" style="margin-top:16px">Please let us know you are coming.</p>
    <a class="down" href="#countdown" aria-label="Scroll down">↓</a>
  </div>
</section>

<section class="sec" id="countdown">
  <div class="inner reveal">
    <p class="label">Until the day</p>
    <h2>Counting down</h2>
    <div class="stamps">
      <div class="stamp"><strong id="days">00</strong><span>Days</span></div>
      <div class="stamp"><strong id="hours">00</strong><span>Hours</span></div>
      <div class="stamp"><strong id="minutes">00</strong><span>Minutes</span></div>
      <div class="stamp"><strong id="seconds">00</strong><span>Seconds</span></div>
    </div>
  </div>
</section>

<section class="sec paper">
  <div class="inner reveal">
    <p class="label">The details</p>
    <h2>Join us</h2>
    <div class="rows">
      <div class="row"><small>Date</small><p data-k="dateLabel"></p></div>
      <div class="row"><small>Time</small><p data-k="timeLabel"></p></div>
      <div class="row"><small>Venue</small><p><span data-k="venue"></span><br><span data-k="place"></span></p></div>
    </div>
    <a class="btn" id="mapLink" target="_blank" rel="noopener">View location</a>
    <a class="btn" id="calLink" target="_blank" rel="noopener">Add to calendar</a>
  </div>
</section>

<section class="sec">
  <div class="inner reveal">
    <p class="label">Reply card</p>
    <h2>Will you come?</h2>
    <form class="reply" id="rsvpForm">
      <label for="guest">Your full name</label>
      <input id="guest" required autocomplete="name">

      <label for="attendance">Will you be attending?</label>
      <select id="attendance" required>
        <option value="">Please select</option>
        <option>Joyfully accepts</option>
        <option>Regretfully declines</option>
      </select>

      <label for="guests">Number of guests</label>
      <select id="guests"><option>1</option><option>2</option><option>3</option><option>4</option></select>

      <button type="submit" id="rsvpButton">Send reply</button>
      <div id="response" role="status" aria-live="polite"></div>
      <div class="sealed wax" id="sealed" hidden><span class="mono"></span></div>
    </form>
  </div>
</section>

<footer>
  <div class="wax"><span class="mono"></span></div>
  <h3 data-names-plain></h3>
  <p>With love</p>
</footer>

<script>
/* ---------- TEMPLATE SETTINGS (change these for each couple) ---------- */
const C = {
  a:'Esi', b:'Kwesi',
  iso:'2026-12-10T09:00:00+00:00',
  dateLabel:'Thursday, 10 December 2026',
  timeLabel:'9:00 AM',
  venue:'Church of Christ', place:'Cantonments, Accra',
  map:'Church of Christ Cantonments Accra'
};
// Paste your Google Apps Script web app URL here so RSVPs land in a Google Sheet.
const RSVP_ENDPOINT = '';

const $ = id => document.getElementById(id);
const names = C.a + ' & ' + C.b;
document.title = names + ' | A Letter For You';
document.querySelectorAll('[data-k]').forEach(el => el.textContent = C[el.dataset.k]);
document.querySelectorAll('[data-np],[data-names-plain]').forEach(el => el.textContent = names);
document.querySelectorAll('.mono').forEach(el => el.textContent = C.a[0] + '&' + C.b[0]);
$('l6').textContent = C.timeLabel + ', ' + C.venue;
$('mapLink').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(C.map);
{
  const s = new Date(C.iso), e = new Date(+s + 3 * 3600000);
  const f = d => d.toISOString().replace(/[-:]|\.\d{3}/g, '');
  $('calLink').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' +
    encodeURIComponent(names + ' Wedding') + '&dates=' + f(s) + '/' + f(e) +
    '&location=' + encodeURIComponent(C.venue + ', ' + C.place);
}

/* Personal guest link: yoursite.com/?guest=Ama */
const guestName = (new URLSearchParams(location.search).get('guest') || '').replace(/[<>]/g, '').trim().slice(0, 40);
$('l1').textContent = guestName ? 'Dear ' + guestName + ',' : 'Dear friends and family,';
$('kicker').textContent = guestName ? 'A letter for ' + guestName : 'A letter for you';
$('addr').textContent = guestName;
if (guestName) $('guest').value = guestName;

/* ---------- OPENING THE LETTER ---------- */
const stage = $('stage'), letter = $('letter');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let state = 0, timers = [];
const later = (ms, f) => timers.push(setTimeout(f, ms));

function showAll() {
  timers.forEach(clearTimeout);
  stage.classList.add('opening', 'peek', 'rise', 'written');
  state = 2;
}

function write() {
  let t = 0.1;
  letter.querySelectorAll('.line').forEach(l => {
    const d = Math.max(0.55, l.textContent.trim().length * (l.classList.contains('s') ? 0.06 : 0.04));
    l.style.setProperty('--d', d.toFixed(2) + 's');
    l.style.setProperty('--t', t.toFixed(2) + 's');
    t += d + 0.15;
  });
  letter.classList.add('write');
  later(t * 1000 + 400, () => { stage.classList.add('written'); state = 2; });
}

stage.addEventListener('click', () => {
  if (state === 0) {
    if (reduce) { showAll(); return; }
    state = 1;
    stage.classList.add('opening');          // seal cracks, flap lifts
    later(1500, () => stage.classList.add('peek'));
    later(2500, () => stage.classList.add('rise'));
    later(3500, write);                      // ink starts
  } else if (state === 1) {
    showAll();                               // a second tap skips ahead
  }
});

/* ---------- PAGE ---------- */
const observer = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
}), { threshold: .12 });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

const target = new Date(C.iso);
function tick() {
  const d = target - new Date();
  const v = d <= 0 ? [0,0,0,0] : [Math.floor(d / 864e5), Math.floor(d / 36e5) % 24, Math.floor(d / 6e4) % 60, Math.floor(d / 1e3) % 60];
  ['days','hours','minutes','seconds'].forEach((id, i) => $(id).textContent = String(v[i]).padStart(2, '0'));
}
tick(); setInterval(tick, 1000);

/* RSVP */
$('rsvpForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const box = $('response'), btn = $('rsvpButton');
  const data = { name: $('guest').value.trim(), attendance: $('attendance').value, guests: $('guests').value, submitted: new Date().toISOString() };
  box.className = ''; box.textContent = ''; $('sealed').hidden = true;
  if (!RSVP_ENDPOINT) {
    console.warn('RSVP_ENDPOINT is empty. Add your Apps Script URL.');
    box.className = 'error'; box.textContent = 'Sorry, replies are not open just yet. Please try again shortly.';
    return;
  }
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    await fetch(RSVP_ENDPOINT, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
    box.textContent = data.attendance === 'Joyfully accepts'
      ? 'Thank you, ' + data.name + '. We cannot wait to celebrate with you.'
      : 'Thank you for letting us know, ' + data.name + '. You will be missed.';
    $('sealed').hidden = false;
    this.reset();
  } catch (err) {
    box.className = 'error'; box.textContent = 'Your reply did not go through. Please check your connection and try again.';
  } finally {
    btn.disabled = false; btn.textContent = 'Send reply';
  }
});
</script>
</body>
</html>
